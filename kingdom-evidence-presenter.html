<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kingdom Evidence · Presenter Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;600;700;800;900&family=Barlow:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/kp-alignment.css">
<link rel="stylesheet" href="/kingdom-evidence.css">
<link rel="stylesheet" href="/kingdom-evidence-presenter.css">
</head>
<body class="presenter-body">
<header class="presenter-top">
  <div>
    <div class="presenter-brand">KINGDOM <b>EVIDENCE</b></div>
    <div class="presenter-subtitle">Matthew 11 · Weeks 1–2 · One continuous session</div>
  </div>
  <div class="presenter-top-right">
    <div class="presenter-live"><span id="presenter-dot" class="dot"></span><span id="presenter-sync">Connecting</span></div>
    <div id="presenter-timer" class="presenter-timer">00:00</div>
  </div>
</header>

<main class="presenter-shell">
  <article id="manuscript" class="manuscript">
    <div class="loading-card">Loading presenter notes…</div>
  </article>

  <aside class="presenter-rail">
    <section class="rail-card live-card">
      <style>.presenter-section-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}.presenter-section-tab{min-height:39px;border:1px solid #315a75;border-radius:9px;background:#071f33;color:#9ebdd0;font-weight:900}.presenter-section-tab.on{background:#153e5b;border-color:#62c8f4;color:#fff}.resume-btn{width:100%;margin-bottom:12px}.presenter-section-break{scroll-margin-top:92px;margin:28px 0 14px;padding:16px 20px;border-radius:14px;background:#08243d;color:#fff;font-family:"Barlow Condensed";font-size:1.15rem;font-weight:900}</style>
      <div class="presenter-section-tabs"><button class="presenter-section-tab on" data-section="week1" type="button">Week 1 · 1–19</button><button class="presenter-section-tab" data-section="week2" type="button">Week 2 · 20–30</button></div>
      <button id="resume-v10" class="pbtn resume-btn" type="button">Resume Week 1 at Matthew 11:10</button>
      <div class="rail-ey">Live Output</div>
      <div id="live-slide-num" class="live-slide-num">STANDBY</div>
      <div id="live-slide-title" class="live-slide-title">The King Confronts Expectations</div>
      <div id="live-slide-meta" class="live-slide-meta">Matthew 11:1–19</div>
      <div class="rail-next"><span>Next</span><strong id="live-next-title">Slide 1</strong></div>
      <div class="rail-controls">
        <button id="prev-btn" class="pbtn" type="button">← Prev</button>
        <button id="next-btn" class="pbtn primary" type="button">Start</button>
        <button id="black-btn" class="pbtn" type="button">Black</button>
        <button id="clear-btn" class="pbtn" type="button">Clear</button>
      </div>
    </section>

    <details class="rail-card" open>
      <summary>Polls <span id="poll-total" class="rail-badge">0</span></summary>
      <div id="rail-polls" class="rail-detail-body"></div>
    </details>

    <details class="rail-card" open>
      <summary>Week 2 Online Stream</summary>
      <div class="rail-detail-body">
        <input id="stream-url" class="presenter-input" type="url" inputmode="url" placeholder="Paste YouTube scheduled/live URL">
        <div style="height:8px"></div>
        <input id="stream-title" class="presenter-input" type="text" placeholder="Stream title" value="Kingdom Evidence · Week 2">
        <div style="height:8px"></div>
        <select id="stream-status" class="presenter-input">
          <option value="starting-soon">Starting Soon</option>
          <option value="live">Live</option>
          <option value="ended">Ended / Replay</option>
          <option value="offline">Offline</option>
        </select>
        <div class="poll-admin-actions" style="margin-top:9px">
          <button id="stream-save" type="button" class="primary">Save Stream</button>
          <a class="pbtn" href="/evidence/week2/online" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">Open Online</a>
        </div>
        <div id="stream-state" class="live-slide-meta" style="margin-top:8px">Loading saved stream…</div>
      </div>
    </details>

    <details class="rail-card">
      <summary>Scripture Bank</summary>
      <div class="rail-detail-body">
        <input id="scripture-search" class="presenter-input" type="search" placeholder="Search reference or words">
        <div id="scripture-results" class="scripture-results"></div>
      </div>
    </details>

    <details class="rail-card">
      <summary>Anonymous Questions <span id="question-total" class="rail-badge">0</span></summary>
      <div id="rail-questions" class="rail-detail-body"></div>
    </details>

    <section class="rail-card text-tools">
      <div class="rail-ey">Reading Size</div>
      <div class="text-size-row">
        <button id="text-smaller" class="pbtn" type="button">A−</button>
        <button id="text-reset" class="pbtn" type="button">Reset</button>
        <button id="text-larger" class="pbtn" type="button">A+</button>
      </div>
    </section>
  </aside>
</main>

<script src="/kingdom-evidence-data.js"></script>
<script src="/kingdom-evidence-week2-data.js"></script>
<script src="/kingdom-evidence-manuscript.js"></script>
<script src="/kingdom-evidence-week2-manuscript.js"></script>
<script src="/kingdom-evidence-presenter.js"></script>
</body>
</html>
