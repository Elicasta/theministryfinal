<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Ministry · Lesson Library</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#090a0c;--panel:#101217;--panel2:#151820;--ink:#f1ede4;--muted:#8a8f98;--line:#252a33;--red:#e8180d;--blue:#61c7ff;--fd:'Bebas Neue',Impact,sans-serif;--fc:'Barlow Condensed','Arial Narrow',sans-serif;--fb:'Barlow',Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--fb)}a{color:inherit;text-decoration:none}.top{position:sticky;top:0;z-index:20;background:rgba(9,10,12,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.topin{max-width:1120px;margin:auto;padding:17px 18px;display:flex;gap:18px;justify-content:space-between;align-items:center}.brand{font-family:var(--fd);font-size:1.35rem;letter-spacing:.08em}.brand b{color:var(--red)}.back{font:800 .72rem var(--fc);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}main{max-width:1120px;margin:auto;padding:34px 18px 80px}.ey{font:900 .68rem var(--fc);letter-spacing:.2em;text-transform:uppercase;color:var(--red)}h1{font:400 clamp(3.1rem,8vw,6.5rem)/.88 var(--fd);margin:10px 0 12px;letter-spacing:.01em}.intro{max-width:720px;color:#b6bac2;line-height:1.55;font-size:1rem}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0 30px}.search{flex:1 1 320px;background:#0d0f14;border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:13px 14px;font:600 .95rem var(--fb);outline:none}.search:focus{border-color:#59616e}.pill{border:1px solid var(--line);background:var(--panel);color:#c5c9cf;border-radius:999px;padding:10px 13px;font:800 .68rem var(--fc);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.pill.on{border-color:var(--ink);color:var(--ink)}.series{margin-top:34px}.series-head{display:flex;align-items:end;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px}.series-title{font:800 1.1rem var(--fc);letter-spacing:.08em;text-transform:uppercase}.count{font:700 .65rem var(--fc);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}.grid{display:grid;gap:9px}.card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;border:1px solid var(--line);background:linear-gradient(180deg,#111319,#0e1015);border-radius:13px;padding:17px 18px}.card.latest{border-color:#315975;background:linear-gradient(180deg,#0d1821,#0d1117)}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:800 .61rem var(--fc);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}.stable{color:#9dd9b1}.latesttag{color:var(--blue)}.title{font:800 clamp(1.2rem,3vw,1.55rem)/1.05 var(--fc);margin:7px 0 5px}.ref{font-size:.83rem;color:#a7adb6}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid #323844;background:#171a21;border-radius:8px;padding:9px 11px;font:900 .65rem var(--fc);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}.btn.primary{background:var(--ink);color:#101216;border-color:var(--ink)}.btn:hover{border-color:#626b78}.empty{display:none;border:1px solid var(--line);border-radius:12px;padding:28px;color:var(--muted)}@media(max-width:720px){main{padding-top:25px}.card{grid-template-columns:1fr}.actions{justify-content:flex-start}.btn{flex:1 1 auto;text-align:center}.topin{padding:14px 16px}h1{font-size:3.7rem}}
</style></head><body>
<header class="top"><div class="topin"><div class="brand">THE <b>MINISTRY</b> · LIBRARY</div><a class="back" href="/">Back to Ministry</a></div></header>
<main><div class="ey">Teaching Archive</div><h1>LESSON LIBRARY</h1><div class="intro">Every known-good lesson in one place. Open the teaching control, projector, manuscript, or student portal without digging through old links.</div>
<div class="tools"><input id="search" class="search" type="search" placeholder="Search title, Scripture, series…"><button class="pill on" data-filter="all">All</button><button class="pill" data-filter="The Ministry">Matthew 10</button><button class="pill" data-filter="Kingdom Principles">Kingdom Principles</button><button class="pill" data-filter="Kingdom Evidence">Matthew 11</button></div>
<div id="root"></div><div id="empty" class="empty">No lessons match that search.</div></main>
<script>
let data=null,filter='all';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function btn(href,label,primary=false){return href?'<a class="btn '+(primary?'primary':'')+'" href="'+esc(href)+'">'+label+'</a>':''}
function render(){if(!data)return;const q=document.getElementById('search').value.trim().toLowerCase();const rows=data.lessons.filter(x=>(filter==='all'||x.series===filter)&&(!q||[x.series,x.sequence,x.title,x.scripture].join(' ').toLowerCase().includes(q)));const groups={};rows.forEach(x=>(groups[x.series]??=[]).push(x));const root=document.getElementById('root');root.innerHTML=Object.entries(groups).map(([series,items])=>'<section class="series"><div class="series-head"><div class="series-title">'+esc(series)+'</div><div class="count">'+items.length+' lesson'+(items.length===1?'':'s')+'</div></div><div class="grid">'+items.sort((a,b)=>a.taughtAt.localeCompare(b.taughtAt)).map(x=>'<article class="card '+(x.id===data.latest?'latest':'')+'"><div><div class="meta"><span>'+esc(x.sequence)+'</span><span>·</span><span>'+esc(x.taughtAt)+'</span><span>·</span><span class="stable">Stable</span>'+(x.id===data.latest?'<span>·</span><span class="latesttag">Latest</span>':'')+'</div><div class="title">'+esc(x.title)+'</div><div class="ref">'+esc(x.scripture)+'</div></div><div class="actions">'+btn(x.artifacts.presentation,'Presentation',true)+btn(x.artifacts.manuscript,'Manuscript')+btn(x.artifacts.projector,'Projector')+btn(x.artifacts.student,'Class Portal')+'</div></article>').join('')+'</div></section>').join('');document.getElementById('empty').style.display=rows.length?'none':'block'}
fetch('/lesson-library.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{data=d;render()}).catch(()=>{document.getElementById('empty').style.display='block';document.getElementById('empty').textContent='Lesson library could not load.'});
document.getElementById('search').addEventListener('input',render);document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('on',x===b));render()});
</script></body></html>
