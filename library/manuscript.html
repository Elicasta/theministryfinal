<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Teaching Manuscript · The Ministry</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;600;700;800;900&family=Barlow:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe7;--paper:#fffdf8;--ink:#171717;--muted:#6b6a67;--line:#d9d4ca;--accent:#9e1d16;--fd:'Bebas Neue',Impact,sans-serif;--fc:'Barlow Condensed','Arial Narrow',sans-serif;--fb:'Barlow',Arial,sans-serif;--fp:'Playfair Display',Georgia,serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb)}a{color:inherit}.top{position:sticky;top:0;z-index:10;background:rgba(243,239,231,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.topin{max-width:900px;margin:auto;padding:13px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font:900 .72rem var(--fc);letter-spacing:.13em;text-transform:uppercase}.top a{font:800 .67rem var(--fc);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--muted)}main{max-width:900px;margin:28px auto 80px;background:var(--paper);border:1px solid var(--line);box-shadow:0 20px 60px rgba(50,35,20,.08);padding:clamp(24px,6vw,64px)}.ey{font:900 .68rem var(--fc);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}h1{font:400 clamp(3rem,8vw,5.7rem)/.9 var(--fd);margin:10px 0}.ref{font:600 1rem var(--fp);font-style:italic;color:var(--muted);margin-bottom:30px}.slide{padding:25px 0;border-top:1px solid var(--line);break-inside:avoid}.slide:first-of-type{border-top:0}.slide-num{font:900 .62rem var(--fc);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}h2{font:800 clamp(1.4rem,4vw,2rem)/1.05 var(--fc);margin:8px 0 13px}.verse{font:500 1.08rem/1.62 var(--fp);padding:15px 18px;border-left:3px solid var(--accent);background:#f8f4ec}.body{font-size:1rem;line-height:1.62}.body ul,.body ol{padding-left:22px}.note{margin-top:15px;padding:12px 14px;background:#f1ede5;border-radius:7px;font-size:.88rem;line-height:1.5;color:#54514c}.note b{font:900 .62rem var(--fc);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-right:6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 10px}.btn{display:inline-block;border:1px solid var(--line);border-radius:7px;padding:9px 11px;text-decoration:none;font:900 .65rem var(--fc);letter-spacing:.08em;text-transform:uppercase}.btn.primary{background:var(--ink);color:white;border-color:var(--ink)}.loading{padding:40px;color:var(--muted)}@media(max-width:720px){main{margin:0;border:0;box-shadow:none;padding:28px 18px 70px}.topin{padding:12px 15px}}@media print{.top,.actions{display:none}body{background:white}main{margin:0;max-width:none;border:0;box-shadow:none;padding:0}.slide{page-break-inside:avoid}}
</style></head><body><header class="top"><div class="topin"><div class="brand">The Ministry · Manuscript</div><a href="/lessons">Lesson Library</a></div></header><main id="main"><div class="loading">Loading manuscript…</div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clean=s=>String(s??'').replace(/&middot;/g,'·');
function slideTitle(s){return s.title||s.hl||s.text||s.kicker||s.ref||s.sup||'Teaching Point'}
function bodyFor(s){const chunks=[];if(s.eyebrow||s.kicker||s.sup)chunks.push('<div class="ey">'+clean(s.eyebrow||s.kicker||s.sup)+'</div>');if(s.ref&&s.text)chunks.push('<div class="verse"><strong>'+clean(s.ref)+'</strong><br>'+clean(s.text)+'</div>');else if(s.ref)chunks.push('<div class="ref">'+clean(s.ref)+'</div>');if(s.sub)chunks.push('<p>'+clean(s.sub)+'</p>');if(s.tk)chunks.push('<p><strong>'+clean(s.tk)+'</strong></p>');const pts=s.pts||s.points||s.steps||s.items;if(Array.isArray(pts)&&pts.length)chunks.push('<ul>'+pts.map(x=>'<li>'+clean(Array.isArray(x)?x.join(' · '):x)+'</li>').join('')+'</ul>');if(s.left||s.right)chunks.push('<p><strong>'+clean(s.left||'')+'</strong></p><p>'+clean(s.right||'')+'</p>');if(s.words)chunks.push('<p><strong>'+s.words.map(clean).join(' → ')+'</strong></p>');return chunks.join('')}
function renderArchive(meta,entry){document.getElementById('main').innerHTML='<div class="ey">'+esc(meta.series)+' · '+esc(meta.sequence)+'</div><h1>'+esc(meta.title)+'</h1><div class="ref">'+esc(meta.scripture)+' · '+esc(meta.taughtAt)+'</div><div class="actions"><a class="btn primary" href="'+esc(meta.artifacts.presentation)+'">Open Presentation</a><a class="btn" href="/lessons">All Lessons</a></div>'+entry.slides.map((s,i)=>'<section class="slide"><div class="slide-num">Slide '+String(i+1).padStart(2,'0')+'</div><h2>'+clean(slideTitle(s))+'</h2><div class="body">'+bodyFor(s)+'</div>'+(s.speakerNote?'<div class="note"><b>Presenter note</b>'+clean(s.speakerNote)+'</div>':'')+'</section>').join('')}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function renderChapter11(meta,id){if(id.endsWith('part-1')){await loadScript('/kingdom-evidence-manuscript.js');return renderFull(meta,window.KE11_MANUSCRIPT||[])}await loadScript('/kingdom-evidence-week2-manuscript.js');return renderFull(meta,window.KE11_WEEK2_MANUSCRIPT||[])}
function renderFull(meta,rows){document.getElementById('main').innerHTML='<div class="ey">'+esc(meta.series)+' · '+esc(meta.sequence)+'</div><h1>'+esc(meta.title)+'</h1><div class="ref">'+esc(meta.scripture)+' · '+esc(meta.taughtAt)+'</div><div class="actions"><a class="btn primary" href="'+esc(meta.artifacts.presentation)+'">Open Presentation</a><a class="btn" href="/lessons">All Lessons</a></div>'+rows.map((m,i)=>'<section class="slide"><div class="slide-num">Slide '+String(i+1).padStart(2,'0')+'</div><h2>'+esc(m.title||'Teaching Point')+'</h2><div class="body">'+(m.html||'')+'</div>'+(m.refs&&m.refs.length?'<div class="note"><b>Scriptures</b>'+m.refs.map(esc).join(' · ')+'</div>':'')+'</section>').join('')}
(async()=>{try{const id=new URLSearchParams(location.search).get('id');const lib=await fetch('/lesson-library.json',{cache:'no-store'}).then(r=>r.json());const meta=lib.lessons.find(x=>x.id===id);if(!meta)throw new Error('Lesson not found');document.title=meta.title+' · Teaching Manuscript';if(meta.manuscriptType==='chapter11')return renderChapter11(meta,id);const arc=await fetch('/library/lesson-archive.json',{cache:'no-store'}).then(r=>r.json());const entry=arc.lessons[id];if(!entry)throw new Error('Archived lesson content not found');renderArchive(meta,entry)}catch(e){document.getElementById('main').innerHTML='<div class="ey">Library Error</div><h1>MANUSCRIPT UNAVAILABLE</h1><p>'+esc(e.message||'Could not load this lesson.')+'</p><div class="actions"><a class="btn" href="/lessons">Back to Library</a></div>'}})();
</script></body></html>
